spring:
  application:
    name: my-cloud
    
  datasource:
    url: jdbc:postgresql://db:5432/mycloud_db
    username: mycloud
    password: mycloudpassword
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
jwt:
  secret: ${JWT_SECRET}
  expiration: 604800000

file:
  storage:
    path: "data/uploads"