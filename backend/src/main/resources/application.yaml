spring:
  application:
    name: my-cloud

  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO_VALUE}
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  autoconfigure:
    exclude:
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

jwt:
  secret: ${JWT_SECRET}
  expiration: 604800000

thumbnail:
  token:
    secret: ${THUMBNAIL_SECRET}
  callback:
    secret: ${THUMBNAIL_CALLBACK_SECRET}
file:
  storage:
    path: "/app/uploads"

logging:
  level:
    org.springframework.security: DEBUG